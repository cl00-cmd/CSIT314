name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validate PHP website
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: csit314_fundraising
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: csit314_fundraising
      DB_USER: root
      DB_PASSWORD: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Create and seed test database
        run: php database/setup.php

      - name: Start local PHP server
        run: |
          php -S 127.0.0.1:8000 -t . > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Smoke test login page
        run: |
          curl --fail --location --silent --show-error http://127.0.0.1:8000/Boundary/login.php > login.html
          grep -qi "login" login.html

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: server.log

  deploy:
    name: Deploy website by FTP
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip deploy when FTP secrets are missing
        if: env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == ''
        run: echo "FTP secrets are not configured; CI passed and deployment was skipped."

      - name: Upload files to hosting
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            database/account.db