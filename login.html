<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UA Login</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card auth-card--solo">
        <p class="eyebrow">Admin Sign In</p>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue to the user administration dashboard.</p>

        <form id="login-form" class="form-stack">
          <div class="field">
            <label for="userId">User ID</label>
            <input id="userId" name="userId" type="text" placeholder="Enter your user ID" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <button type="submit">Login</button>
          <p id="message" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="./scripts/auth.js"></script>
  </body>
</html>
